<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Stonks v2 — Градиенти и гладки форми</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --card: #1a1a2e;
      --accent: #1fd67a;
      --text: #e0e0e0;
      --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #1fd67a, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }
    .canvas-wrap {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    canvas { border-radius: 12px; display: block; }
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: linear-gradient(135deg, #1fd67a, #0e8a4a);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(31,214,122,0.4);
    }
    button.secondary { background: linear-gradient(135deg, #444, #222); }
    .info {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem;
      min-width: 280px;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .info h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent); }
    .trait {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.85rem;
    }
    .trait:last-child { border-bottom: none; }
    .trait-label { color: var(--muted); }
    .trait-value { font-weight: 500; }
    .rarity-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 0.5rem;
    }
    .rarity-common { background: #555; color: #ccc; }
    .rarity-uncommon { background: #2a6e2a; color: #5cff5c; }
    .rarity-rare { background: #2a3e8e; color: #5c8cff; }
    .rarity-legendary { background: #8a6e1a; color: #ffd700; }
    .id-input {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .id-input input {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #333;
      color: white;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .id-input input:focus { outline: none; border-color: var(--accent); }
    .score-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, #1fd67a, #ffd700);
      border-radius: 3px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>🕯️ The Stonks v2</h1>
  <p class="sub">Градиенти и гладки форми — 10,000 уникални комбинации</p>

  <div class="container">
    <div class="canvas-wrap">
      <canvas id="stonk-canvas" width="480" height="480"></canvas>
      <div class="controls">
        <button id="btn-random">🎲 Следващ Stonk</button>
        <button id="btn-prev" class="secondary">← Предишен</button>
        <button id="btn-next" class="secondary">Следващ →</button>
      </div>
      <div class="id-input">

  <script type="module">
    import { StonkGeneratorV2 } from './js/stonk-generator-v2.js';

    const gen = new StonkGeneratorV2({ basePath: '.' });
    const canvas = document.getElementById('stonk-canvas');
    const traitsList = document.getElementById('traits-list');
    const rarityScore = document.getElementById('rarity-score');
    const rarityRank = document.getElementById('rarity-rank');
    const scoreFill = document.getElementById('score-fill');
    const idInput = document.getElementById('id-input');

    let currentId = 1;

    async function showStonk(id) {
      currentId = Math.max(1, Math.min(10000, id));
      idInput.value = currentId;

      const info = gen.getStonk(currentId);
      await gen.render(currentId, canvas, { size: 480 });

      traitsList.innerHTML = '';
      for (const t of info.traits) {
        const tierClass = t.rarityTier !== 'common' ? `rarity-${t.rarityTier}` : '';
        const badge = tierClass ? `<span class="rarity-badge ${tierClass}">${t.rarityTier}</span>` : '';
        traitsList.innerHTML += `
          <div class="trait">
            <span class="trait-label">${t.categoryLabel}</span>
            <span class="trait-value">${t.name}${badge}</span>
          </div>
        `;
      }

      rarityScore.textContent = info.rarityScore.toFixed(2);
      rarityRank.textContent = `#${info.rarityRank} / ${info.totalSupply}`;
      scoreFill.style.width = `${Math.min(100, info.rarityScore)}%`;
    }

    await gen.load();
    await showStonk(Math.floor(Math.random() * 10000) + 1);

    document.getElementById('btn-random').addEventListener('click', () => {
      showStonk(Math.floor(Math.random() * 10000) + 1);
    });
    document.getElementById('btn-prev').addEventListener('click', () => {
      showStonk(currentId - 1);
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      showStonk(currentId + 1);
    });
    document.getElementById('btn-go').addEventListener('click', () => {
      const id = parseInt(idInput.value);
      if (id >= 1 && id <= 10000) showStonk(id);
    });
    idInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const id = parseInt(idInput.value);
        if (id >= 1 && id <= 10000) showStonk(id);
      }
    });
  </script>
</body>
</html>
        <input type="number" id="id-input" min="1" max="10000" placeholder="ID (1-10000)" />
        <button id="btn-go">Отиди</button>
      </div>
    </div>

    <div class="info" id="info-panel">
      <h2>📋 Трейтове</h2>
      <div id="traits-list"></div>
      <div style="margin-top: 1rem;">
        <div class="trait">
          <span class="trait-label">Rarity Score</span>
          <span class="trait-value" id="rarity-score">-</span>
        </div>
        <div class="score-bar"><div class="score-fill" id="score-fill"></div></div>
        <div class="trait" style="margin-top: 0.5rem;">
          <span class="trait-label">Rarity Rank</span>
          <span class="trait-value" id="rarity-rank">-</span>
        </div>
      </div>
    </div>
  </div>
