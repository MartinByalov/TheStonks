<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stonks Generator</title>
<style>
  :root {
    --bg-dark: #0f1419;
    --bg-card: #1a1f2e;
    --text: #e8eaed;
    --text-muted: #9aa0ac;
    --accent: #16c784;
    --accent-dark: #0b7c59;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-dark) 0%, #1c2540 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .container {
    max-width: 600px;
    width: 100%;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--accent), #00d4aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 30px;
    font-size: 14px;
  }

  .button {
    width: 100%;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), #0da572);
    color: #0f1419;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 12px rgba(22, 199, 132, 0.25);
  }

  .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(22, 199, 132, 0.35);
  }

  .button:active {
    transform: translateY(0);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 25, 0.85);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: var(--bg-card);
    border: 1px solid #2a3142;
    border-radius: 12px;
    max-width: 500px;
    width: 100%;
    padding: 24px;
    position: relative;
    animation: slideIn 0.2s ease;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes slideIn {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 600;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  .modal-close:hover {
    color: var(--text);
  }

  .rarity-badge {
    display: inline-block;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    margin-top: 6px;
    background: #2a3142;
    color: var(--text-muted);
  }

  .rarity-badge.legendary { background: #8b5a00; color: #ffd700; }
  .rarity-badge.rare { background: #4a3d8e; color: #a78bfa; }
  .rarity-badge.uncommon { background: #1a5f3e; color: #58a6ff; }

  .canvas-wrap {
    background: linear-gradient(135deg, #1a1f2e, #0f1419);
    border: 1px solid #2a3142;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 280px;
  }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    height: auto;
  }

  .traits-list {
    list-style: none;
    margin-bottom: 16px;
    background: #0f1419;
    border-radius: 6px;
    overflow: hidden;
  }

  .traits-list li {
    padding: 10px 12px;
    border-bottom: 1px solid #1a1f2e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .traits-list li:last-child {
    border-bottom: none;
  }

  .trait-label {
    color: var(--text-muted);
  }

  .trait-value {
    font-weight: 500;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .btn-secondary {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #2a3142;
    background: #1a1f2e;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s;
  }

  .btn-secondary:hover {
    background: #252d3d;
  }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 20px;
  }

  .spinner {
    border: 2px solid #2a3142;
    border-top: 2px solid var(--accent);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    animation: spin 0.8s linear infinite;
    margin: 10px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="container">
    <h1>🕯️ The Stonks</h1>
    <p class="subtitle">10,000 уникални Stonk персонажа<br>Натисни за случаен Stonk</p>
    <button class="button" id="generateBtn">Генерирай Stonk</button>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="title">Stonk #0000</div>
          <div class="rarity-badge" id="rarity">Rank —</div>
        </div>
        <button class="modal-close" id="closeModal">✕</button>
      </div>

      <div class="canvas-wrap">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Зареждане на Stonk...</p>
        </div>
        <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>
      </div>

      <ul class="traits-list" id="traits"></ul>

      <div class="modal-actions">
        <button class="btn-secondary" id="randomBtn">🎲 Друг</button>
        <button class="button" style="flex: 1;" id="closeBtn">Затвори</button>
      </div>
    </div>
  </div>

<script type="module">
  import { StonkGenerator } from './js/stonk-generator.js';

  const gen = new StonkGenerator({ basePath: '.' });
  const modal = document.getElementById('modal');
  const canvas = document.getElementById('canvas');
  const loading = document.getElementById('loading');
  const title = document.getElementById('title');
  const rarity = document.getElementById('rarity');
  const traits = document.getElementById('traits');

  let ready = gen.load().then(() => console.log('Generator ready'));

  async function openStonk(id) {
    await ready;
    loading.style.display = 'block';
    canvas.style.display = 'none';
    modal.classList.add('open');

    const info = gen.getStonk(id);
    
    title.textContent = `Stonk #${String(info.id).padStart(4, '0')}`;
    rarity.textContent = `Rank: ${info.rarityRank} / ${info.totalSupply}`;
    rarity.className = 'rarity-badge';

    traits.innerHTML = info.traits
      .map((t) => {
        const tierClass = t.rarityTier === 'legendary' ? 'legendary' : 
                         t.rarityTier === 'rare' ? 'rare' :
                         t.rarityTier === 'uncommon' ? 'uncommon' : '';
        return `<li>
          <span class="trait-label">${t.label}</span>
          <span class="trait-value">${t.name}</span>
        </li>`;
      })
      .join('');

    try {
      await gen.render(id, canvas);
      loading.style.display = 'none';
      canvas.style.display = 'block';
    } catch (err) {
      console.error(err);
      loading.innerHTML = `<p style="color:#ef4444">Грешка: ${err.message}</p>`;
    }
  }

  document.getElementById('generateBtn').addEventListener('click', async () => {
    await ready;
    openStonk(gen.randomId());
  });

  document.getElementById('randomBtn').addEventListener('click', async () => {
    await ready;
    openStonk(gen.randomId());
  });

  function closeModal() {
    modal.classList.remove('open');
  }

  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
</script>
</body>
</html>
